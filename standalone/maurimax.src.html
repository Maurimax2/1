<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>موريماكس | MAURIMAX — كل ما تحب. اشتراك واحد.</title>
<meta name="description" content="موريماكس — أكبر منصة ترفيهية في موريتانيا. أفلام ومسلسلات وقنوات مباشرة وكل البطولات الكروية بجودة 4K. اشتراك واحد يبدأ من 350 أوقية.">
<meta name="theme-color" content="#ffffff">
<meta property="og:type" content="website">
<meta property="og:locale" content="ar_MR">
<meta property="og:title" content="موريماكس — كل ما تحب. اشتراك واحد.">
<meta property="og:description" content="أفلام ومسلسلات وقنوات مباشرة وكل البطولات الكروية بجودة 4K. يبدأ من 350 أوقية.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,75..125,400..900;1,75..125,400..900&family=Noto+Kufi+Arabic:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="icon" href="__LOGO_URI__">
<style>
/* ==========================================================
   MAURIMAX — single-file build
   Monument style: white ground, monumental type, violet + orange.
   Arabic is the default language; English via the header toggle.
   ========================================================== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --white:#ffffff;
  --paper:#f6f4f9;          /* tinted section ground */
  --paper2:#efeaf6;
  --ink:#16081f;            /* violet-black */
  --muted:#6b5b78;
  --line:#e6e0ee;
  --violet:#4e0d83;         /* sampled from the logo */
  --violet-2:#7a2bc4;
  --violet-tint:#f2ebfa;
  --orange:#e86a30;         /* sampled from the logo */
  --orange-2:#ff8a4f;
  --orange-tint:#fef0e7;
  --lat:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --ar:'Noto Kufi Arabic','Segoe UI',Tahoma,sans-serif;
  color-scheme:light;
}
html{scroll-behavior:smooth;scroll-padding-top:104px;overflow-x:clip;background:var(--white)}
body{background:var(--white);color:var(--ink);font-family:var(--ar);font-size:16px;line-height:1.65;
  -webkit-font-smoothing:antialiased;overflow-x:clip}
html[dir=ltr] body{font-family:var(--lat)}
h1,h2,h3,h4{line-height:1.18;font-weight:800;letter-spacing:0}
/* Monument: wide, heavy, tightly tracked Latin display. */
html[dir=ltr] h1,html[dir=ltr] h2,html[dir=ltr] h3,html[dir=ltr] .mono{
  font-family:var(--lat);font-variation-settings:'wdth' 118;letter-spacing:-.02em;line-height:1.02}
.mono{font-family:var(--lat);font-variation-settings:'wdth' 118;font-weight:900}
p{text-wrap:pretty}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea{font:inherit}
img,svg{display:block;max-width:100%}
::selection{background:var(--violet);color:#fff}
:focus-visible{outline:2.5px solid var(--violet);outline-offset:3px;border-radius:4px}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:var(--paper)}
::-webkit-scrollbar-thumb{background:var(--violet);border-radius:99px;border:3px solid var(--paper)}
html[dir=rtl] :not(.keep){letter-spacing:normal}
.keep{letter-spacing:.06em}

.wrap{width:100%;max-width:1320px;margin:0 auto;padding:0 20px}
@media(min-width:640px){.wrap{padding:0 36px}}
@media(min-width:1200px){.wrap{padding:0 56px}}
.pad{padding:84px 0}
@media(min-width:768px){.pad{padding:132px 0}}
.paper{background:var(--paper)}

/* ——— Monument section headers ——— */
.shead{display:flex;flex-direction:column;gap:22px;max-width:760px}
.shead.mid{margin:0 auto;text-align:center;align-items:center}
.tagnum{display:inline-flex;align-items:center;gap:12px;font-family:var(--lat);font-weight:800;
  font-size:11px;letter-spacing:.2em;color:var(--violet);text-transform:uppercase}
.tagnum b{font-variation-settings:'wdth' 125;font-size:12px}
.tagnum s{display:block;width:34px;height:2px;background:var(--orange);text-decoration:none}
.shead h2{font-size:clamp(2.1rem,5.6vw,4.4rem);font-weight:900;letter-spacing:-.01em}
html[dir=rtl] .shead h2{line-height:1.22}
.shead p{font-size:clamp(.98rem,1.6vw,1.12rem);color:var(--muted);max-width:620px}
.hl{color:var(--violet)}
.hl-o{color:var(--orange)}
/* Marker highlight — a flat brand block behind a word. */
.mark{position:relative;display:inline-block;padding:0 .18em;color:#fff;z-index:0}
.mark::before{content:'';position:absolute;inset:.06em -.02em .1em;background:var(--violet);
  border-radius:6px;z-index:-1;transform:rotate(-.6deg)}
.mark.o::before{background:var(--orange)}

/* ——— Buttons ——— */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;
  height:54px;padding:0 30px;border-radius:99px;font-weight:800;font-size:15px;overflow:hidden;
  transition:transform .2s,box-shadow .3s,background .3s,color .3s;white-space:nowrap}
.btn:active{transform:scale(.975)}
.btn-lg{height:62px;padding:0 38px;font-size:16px}
.btn-sm{height:44px;padding:0 22px;font-size:14px}
.btn-v{background:var(--violet);color:#fff;box-shadow:0 12px 30px -12px rgba(78,13,131,.6)}
.btn-v:hover{background:#3d0a68;box-shadow:0 18px 40px -14px rgba(78,13,131,.75)}
.btn-o{background:var(--orange);color:#fff;box-shadow:0 12px 30px -12px rgba(232,106,48,.65)}
.btn-o:hover{background:#d55c25;box-shadow:0 18px 40px -14px rgba(232,106,48,.8)}
.btn-line{border:2px solid var(--ink);color:var(--ink);background:transparent}
.btn-line:hover{background:var(--ink);color:#fff}
.btn-ghost{border:2px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--violet);color:var(--violet)}
.btn-wa{background:#12a150;color:#fff;box-shadow:0 12px 30px -12px rgba(18,161,80,.65)}
.btn-wa:hover{background:#0e8a44}
.btn-full{width:100%}
.btn .rip{position:absolute;width:0;height:0;border-radius:99px;background:rgba(255,255,255,.4);
  transform:translate(-50%,-50%);pointer-events:none;animation:rip .6s ease-out forwards}
@keyframes rip{to{width:420px;height:420px;opacity:0}}
html[dir=rtl] .flip{transform:scaleX(-1)}

/* ——— Reveal ——— */
.rev{opacity:0;transform:translateY(26px);transition:opacity .8s cubic-bezier(.16,1,.3,1),transform .8s cubic-bezier(.16,1,.3,1)}
.rev.in{opacity:1;transform:none}

/* ——— Header ——— */
header{position:fixed;inset-inline:0;top:0;z-index:60;background:rgba(255,255,255,.86);
  backdrop-filter:blur(18px) saturate(160%);border-bottom:1px solid transparent;transition:border-color .4s,box-shadow .4s}
header.stuck{border-bottom-color:var(--line);box-shadow:0 8px 30px -22px rgba(22,8,31,.5)}
#bar{display:flex;align-items:center;justify-content:space-between;gap:18px;height:76px}
.brand{display:inline-flex;align-items:center;gap:12px;flex-shrink:0}
.brand img{width:40px;height:40px}
.brand b{font-family:var(--lat);font-variation-settings:'wdth' 120;font-weight:900;font-size:20px;
  letter-spacing:.02em;color:var(--ink)}
.brand b i{font-style:normal;color:var(--orange)}
nav.main{display:none;align-items:center;gap:4px}
@media(min-width:1080px){nav.main{display:flex}}
nav.main a{position:relative;padding:10px 16px;font-size:14.5px;font-weight:600;color:var(--muted);
  border-radius:99px;transition:color .25s,background .25s}
nav.main a:hover{color:var(--violet);background:var(--violet-tint)}
.tools{display:flex;align-items:center;gap:8px}
.ico{position:relative;display:flex;align-items:center;justify-content:center;gap:6px;height:44px;
  min-width:44px;padding:0 12px;border-radius:99px;border:2px solid var(--line);color:var(--ink);
  transition:border-color .25s,color .25s,background .25s}
.ico:hover{border-color:var(--violet);color:var(--violet)}
#count{position:absolute;top:-5px;inset-inline-end:-5px;display:none;align-items:center;justify-content:center;
  height:21px;min-width:21px;padding:0 6px;border-radius:99px;background:var(--orange);color:#fff;
  font-family:var(--lat);font-size:11px;font-weight:900}
#count.on{display:flex}
#navcta{display:none}
@media(min-width:640px){#navcta{display:inline-flex}}
#burger{display:flex}
@media(min-width:1080px){#burger{display:none}}
#prog{position:fixed;top:0;inset-inline:0;height:3px;z-index:70;transform-origin:right;transform:scaleX(0);
  background:linear-gradient(90deg,var(--violet),var(--orange))}
html[dir=ltr] #prog{transform-origin:left}

#menu{position:fixed;inset:0;z-index:55;display:none;background:#fff}
#menu.on{display:block}
#menu .inner{display:flex;flex-direction:column;justify-content:center;height:100%;padding:80px 0}
#menu a{display:flex;align-items:center;justify-content:space-between;padding:18px 0;font-size:28px;
  font-weight:800;border-bottom:1px solid var(--line)}
#menu a span{font-family:var(--lat);font-size:13px;font-weight:800;color:var(--orange)}

/* ——— Hero ——— */
#hero{position:relative;padding:128px 0 72px;overflow:hidden}
@media(min-width:900px){#hero{padding:150px 0 96px}}
.heroGrid{display:grid;gap:52px;align-items:center}
@media(min-width:980px){.heroGrid{grid-template-columns:1.05fr .95fr;gap:56px}}
#hero h1{font-size:clamp(2.6rem,7.4vw,5.6rem);font-weight:900}
html[dir=rtl] #hero h1{line-height:1.2}
.heroSub{margin-top:26px;font-size:clamp(1rem,1.9vw,1.2rem);color:var(--muted);max-width:540px}
.heroCta{margin-top:38px;display:flex;flex-wrap:wrap;gap:14px}
.heroFrom{margin-top:30px;display:inline-flex;align-items:baseline;gap:10px;padding:14px 22px;
  border-radius:99px;background:var(--violet-tint);border:1px solid #e2d3f3}
.heroFrom .n{font-family:var(--lat);font-variation-settings:'wdth' 120;font-weight:900;font-size:30px;color:var(--violet)}
.heroFrom .l{font-size:13px;font-weight:600;color:var(--violet)}
.heroPills{margin-top:26px;display:flex;flex-wrap:wrap;gap:10px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:99px;
  border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted);background:#fff}
.pill i{width:7px;height:7px;border-radius:99px;background:var(--orange)}
/* Blueprint field behind the hero art */
.heroArt{position:relative}
.heroArt .field{position:absolute;inset:-8% -6%;border-radius:36px;background:
  radial-gradient(ellipse 70% 60% at 70% 20%,rgba(122,43,196,.14),transparent 62%),
  radial-gradient(ellipse 60% 60% at 20% 85%,rgba(232,106,48,.14),transparent 62%),
  var(--paper)}
.heroArt .grid{position:absolute;inset:-8% -6%;border-radius:36px;opacity:.5;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:46px 46px;
  -webkit-mask-image:radial-gradient(ellipse 70% 70% at 50% 50%,#000 30%,transparent 78%);
  mask-image:radial-gradient(ellipse 70% 70% at 50% 50%,#000 30%,transparent 78%)}
.heroArt .stage{position:relative;padding:8% 4%}
/* Three posters fanned with depth, the player stepping out in front of them.
   The fan is symmetric, so physical left is correct in both directions. */
/* The fan is inset from the edge the player stands on, so he overlaps it
   rather than burying the middle poster. */
.fan{position:relative;aspect-ratio:4/3.15;margin-inline-end:15%}
.pc{position:absolute;border-radius:18px;overflow:hidden;background:#1b0b28;
  box-shadow:0 30px 60px -28px rgba(22,8,31,.6),0 0 0 1px rgba(255,255,255,.5)}
.pc img{display:block;width:100%;height:100%;object-fit:cover}
.pc-1{width:46%;left:0;top:17%;z-index:1;transform:rotate(-7deg)}
.pc-2{width:48%;left:27%;top:0;z-index:2}
.pc-3{width:46%;left:55%;top:19%;z-index:1;transform:rotate(7deg)}
.pc::after{content:'';position:absolute;inset:0;
  background:linear-gradient(to top,rgba(14,4,22,.45),transparent 50%)}
@media(max-width:900px){.fan{margin-inline-end:9%}
  .pc-1{width:43%;left:0}.pc-2{width:45%;left:26%}.pc-3{width:43%;left:51%}}
@media(prefers-reduced-motion:no-preference){
  .pc{animation:drift 7s ease-in-out infinite}
  .pc-2{animation-duration:8.5s;animation-delay:-1.4s}
  .pc-3{animation-duration:7.8s;animation-delay:-2.6s}
  @keyframes drift{50%{translate:0 -10px}}
}

/* ——— Ticker band ——— */
.band{background:var(--violet);color:#fff;overflow:hidden;padding:18px 0}
.band .track{display:flex;width:max-content;gap:0;animation:march 38s linear infinite}
html[dir=rtl] .band .track{animation-name:marchR}
@keyframes march{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes marchR{from{transform:translateX(0)}to{transform:translateX(50%)}}
.band .it{display:inline-flex;align-items:center;gap:26px;padding:0 26px;font-family:var(--lat);
  font-variation-settings:'wdth' 118;font-weight:900;font-size:15px;letter-spacing:.06em;white-space:nowrap}
html[dir=rtl] .band .it{font-family:var(--ar);font-weight:800;letter-spacing:0}
.band .it em{font-style:normal;color:var(--orange-2);font-size:18px}

/* ——— Stats ——— */
/* minmax(0,…) rather than 1fr: the figures are single unbreakable tokens, so
   the default min-content floor would push the grid past a narrow viewport. */
.statRow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px;background:var(--line);
  border:1px solid var(--line);border-radius:26px;overflow:hidden}
@media(min-width:900px){.statRow{grid-template-columns:repeat(4,minmax(0,1fr))}}
.statCell{background:#fff;padding:36px 26px;transition:background .35s}
@media(max-width:520px){.statCell{padding:26px 16px}}
.statCell:hover{background:var(--violet-tint)}
.statCell .n{font-family:var(--lat);font-variation-settings:'wdth' 122;font-weight:900;
  font-size:clamp(1.5rem,6.2vw,3.2rem);color:var(--violet);line-height:1}
.statCell .l{margin-top:12px;font-size:15px;font-weight:700}
.statCell .h{margin-top:5px;font-size:12.5px;color:var(--muted)}

/* ——— Plan cards ——— */
.plans{display:grid;gap:20px;margin-top:60px}
@media(min-width:680px){.plans{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1120px){.plans{grid-template-columns:repeat(4,1fr)}}
.plan{position:relative;display:flex;flex-direction:column;background:#fff;border:2px solid var(--line);
  border-radius:26px;padding:30px 26px;transition:transform .4s cubic-bezier(.16,1,.3,1),border-color .35s,box-shadow .4s}
.plan:hover{transform:translateY(-8px);border-color:#d8cbe9;box-shadow:0 30px 60px -34px rgba(22,8,31,.4)}
.plan.best{border-color:var(--violet);background:var(--violet);color:#fff;
  box-shadow:0 34px 70px -34px rgba(78,13,131,.7)}
.plan.best:hover{border-color:var(--violet)}
.plan .tag{position:absolute;top:-14px;inset-inline-start:26px;display:inline-flex;align-items:center;
  height:28px;padding:0 14px;border-radius:99px;background:var(--orange);color:#fff;
  font-family:var(--lat);font-size:11px;font-weight:900;letter-spacing:.08em}
html[dir=rtl] .plan .tag{font-family:var(--ar);letter-spacing:0;font-weight:800}
.plan .dur{font-size:17px;font-weight:800}
.plan.best .dur{color:#fff}
.plan .amount{margin-top:18px;display:flex;align-items:flex-start;gap:6px}
.plan .amount b{font-family:var(--lat);font-variation-settings:'wdth' 122;font-weight:900;
  font-size:clamp(2.6rem,5vw,3.4rem);line-height:.95;color:var(--violet)}
.plan.best .amount b{color:#fff}
.plan .amount s{text-decoration:none;font-size:13px;font-weight:700;color:var(--muted);padding-top:8px}
.plan.best .amount s{color:rgba(255,255,255,.7)}
.plan .per{margin-top:10px;font-size:13px;color:var(--muted)}
.plan.best .per{color:rgba(255,255,255,.75)}
.plan .save{margin-top:14px;display:inline-flex;align-items:center;padding:6px 12px;border-radius:99px;
  background:var(--orange-tint);color:#b8511f;font-size:12px;font-weight:800}
.plan.best .save{background:rgba(255,255,255,.16);color:#fff}
.plan .art{margin:22px -6px 0;border-radius:18px;overflow:hidden;aspect-ratio:1/1}
.plan ul{list-style:none;margin-top:22px;padding-top:20px;border-top:1px solid var(--line);
  display:flex;flex-direction:column;gap:11px;flex:1}
.plan.best ul{border-top-color:rgba(255,255,255,.2)}
.plan li{display:flex;align-items:flex-start;gap:10px;font-size:13.5px;line-height:1.45;color:#3b2b47}
.plan.best li{color:rgba(255,255,255,.9)}
.plan li svg{flex-shrink:0;margin-top:3px;color:var(--orange)}
.plan.best li svg{color:var(--orange-2)}
.plan .go{margin-top:24px}

/* ——— Generic card grid ——— */
.grid3{display:grid;gap:20px;margin-top:60px}
@media(min-width:640px){.grid3{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1024px){.grid3{grid-template-columns:repeat(4,1fr)}}
.feat{background:#fff;border:1px solid var(--line);border-radius:24px;padding:28px;transition:transform .35s,box-shadow .35s,border-color .35s}
.feat:hover{transform:translateY(-6px);border-color:#dccff0;box-shadow:0 26px 50px -32px rgba(22,8,31,.34)}
.feat .ic{display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;
  border-radius:16px;background:var(--violet-tint);color:var(--violet);margin-bottom:20px}
.feat h3{font-size:17px;font-weight:800}
.feat p{margin-top:10px;font-size:13.5px;color:var(--muted)}

/* ——— Rails ——— */
.railwrap{position:relative}
.rail{display:flex;gap:18px;overflow-x:auto;padding:4px 0 18px;scroll-snap-type:x mandatory;
  scrollbar-width:none;margin-inline:-20px;padding-inline:20px}
.rail::-webkit-scrollbar{display:none}
.rail>*{scroll-snap-align:start;flex-shrink:0}
.railbtn{position:absolute;top:40%;z-index:12;display:none;align-items:center;justify-content:center;
  width:48px;height:48px;border-radius:99px;background:#fff;border:2px solid var(--line);
  color:var(--ink);transform:translateY(-50%);transition:all .28s;box-shadow:0 12px 28px -18px rgba(22,8,31,.5)}
.railbtn:hover{border-color:var(--violet);color:var(--violet);transform:translateY(-50%) scale(1.08)}
.railbtn.off{opacity:0;pointer-events:none}
.railbtn.prev{inset-inline-start:-14px}
.railbtn.next{inset-inline-end:-14px}
@media(min-width:1024px){.railbtn{display:flex}}
.cat{position:relative;width:230px;transition:transform .4s cubic-bezier(.16,1,.3,1)}
@media(min-width:640px){.cat{width:262px}}
.cat:hover{transform:translateY(-10px)}
.cat .fr{position:relative;aspect-ratio:3/4;border-radius:22px;overflow:hidden;background:var(--paper2)}
.cat .fr>svg,.cat .fr>.artimg{position:absolute;inset:0;width:100%;height:100%;transition:transform 1s ease-out}
.cat:hover .fr>svg,.cat:hover .fr>.artimg{transform:scale(1.07)}
.cat .meta{position:absolute;inset-inline:0;bottom:0;padding:56px 20px 20px;color:#fff;
  background:linear-gradient(to top,rgba(16,6,24,.92),rgba(16,6,24,.35) 46%,transparent)}
.cat h3{font-size:20px;font-weight:800}
.cat .c{margin-top:3px;font-size:12px;opacity:.75}

/* ——— Leagues ——— */
.leagueBand{border:1px solid var(--line);border-radius:28px;overflow:hidden;background:#fff}
.leagueTop{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px;
  padding:30px;border-bottom:1px solid var(--line)}
.leagueList{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line)}
@media(min-width:720px){.leagueList{grid-template-columns:repeat(4,1fr)}}
.lg{background:#fff;padding:26px 20px;display:flex;flex-direction:column;gap:8px;transition:background .3s}
.lg:hover{background:var(--violet-tint)}
.lg .nm{font-family:var(--lat);font-variation-settings:'wdth' 116;font-weight:900;font-size:15px;
  letter-spacing:.01em;color:var(--ink)}
.lg .sub{font-size:12px;color:var(--muted)}

/* ——— Reviews ——— */
.rvRail{display:flex;gap:18px;overflow-x:auto;scrollbar-width:none;padding-bottom:16px;
  margin-inline:-20px;padding-inline:20px;scroll-snap-type:x mandatory}
.rvRail::-webkit-scrollbar{display:none}
.rv{flex-shrink:0;scroll-snap-align:start;width:330px;background:#fff;border:1px solid var(--line);
  border-radius:24px;padding:26px;display:flex;flex-direction:column}
@media(min-width:640px){.rv{width:390px}}
.rv .q{flex:1;margin-top:16px;font-size:14.5px;line-height:1.75;color:#3b2b47}
.rv .who{display:flex;align-items:center;gap:13px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.rv .av{width:44px;height:44px;border-radius:99px;display:flex;align-items:center;justify-content:center;
  background:var(--violet);color:#fff;font-family:var(--lat);font-weight:900;font-size:14px;flex-shrink:0}

/* ——— FAQ ——— */
.faqWrap{display:grid;gap:44px}
@media(min-width:1024px){.faqWrap{grid-template-columns:.8fr 1.2fr;gap:72px;align-items:start}}
.acc{border-bottom:1px solid var(--line)}
.acc button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:20px;
  padding:22px 0;text-align:start;font-size:16px;font-weight:700;transition:color .25s}
.acc.on button{color:var(--violet)}
.acc .pm{flex-shrink:0;position:relative;width:26px;height:26px;border-radius:99px;
  background:var(--violet-tint);transition:background .3s,transform .35s}
.acc.on .pm{background:var(--violet);transform:rotate(135deg)}
.acc .pm::before,.acc .pm::after{content:'';position:absolute;inset:50% 7px auto;height:2px;
  background:var(--violet);transform:translateY(-50%);transition:background .3s}
.acc .pm::after{inset:7px auto 7px 50%;width:2px;height:auto;transform:translateX(-50%)}
.acc.on .pm::before,.acc.on .pm::after{background:#fff}
.acc .panel{max-height:0;overflow:hidden;transition:max-height .45s cubic-bezier(.16,1,.3,1)}
.acc .panel p{padding-bottom:24px;font-size:14.5px;line-height:1.8;color:var(--muted)}

/* ——— Footer ——— */
footer{background:var(--ink);color:#fff;padding-top:76px}
footer a{color:rgba(255,255,255,.62);transition:color .25s}
footer a:hover{color:#fff}
.fcta{background:var(--violet);border-radius:30px;padding:48px 30px;display:flex;flex-direction:column;
  gap:28px;align-items:center;text-align:center;margin-bottom:66px}
@media(min-width:900px){.fcta{flex-direction:row;justify-content:space-between;text-align:start;padding:52px}}
.fcta h2{font-size:clamp(1.7rem,3.6vw,2.7rem);font-weight:900;color:#fff}
.fcols{display:grid;gap:44px;padding-bottom:52px}
@media(min-width:768px){.fcols{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1024px){.fcols{grid-template-columns:1.5fr repeat(3,1fr)}}
.fcols h3{font-family:var(--lat);font-size:11px;font-weight:900;letter-spacing:.18em;
  color:var(--orange);text-transform:uppercase}
.fcols ul{list-style:none;margin-top:18px;display:flex;flex-direction:column;gap:11px;font-size:14px}
.fbot{display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;
  padding:26px 0;border-top:1px solid rgba(255,255,255,.12);font-size:12.5px;color:rgba(255,255,255,.45)}
@media(min-width:640px){.fbot{flex-direction:row;justify-content:space-between;text-align:start}}
.soc{display:flex;gap:10px;margin-top:24px}
.soc a{display:flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:14px;
  border:1px solid rgba(255,255,255,.18);transition:all .28s}
.soc a:hover{background:#fff;color:var(--ink);border-color:#fff}

/* ——— Floating WhatsApp ——— */
#fab{position:fixed;bottom:22px;inset-inline-end:22px;z-index:50;display:none;align-items:center;gap:0;
  height:60px;padding:0 18px;border-radius:99px;background:#12a150;color:#fff;overflow:hidden;
  box-shadow:0 18px 40px -14px rgba(18,161,80,.75);transition:gap .35s,padding .35s}
#fab.on{display:flex}
#fab:hover{gap:10px;padding-inline-end:26px}
#fab .lbl{max-width:0;overflow:hidden;white-space:nowrap;font-weight:800;font-size:14px;transition:max-width .35s}
#fab:hover .lbl{max-width:150px}

/* ——— Cart + checkout ——— */
.ov{position:fixed;inset:0;z-index:80;display:none}
.ov.on{display:block}
.ov .scrim{position:absolute;inset:0;background:rgba(22,8,31,.45);backdrop-filter:blur(6px)}
#drawer{position:absolute;top:0;inset-inline-end:0;display:flex;flex-direction:column;height:100%;
  width:100%;max-width:452px;background:#fff;transform:translateX(-100%);
  transition:transform .45s cubic-bezier(.16,1,.3,1)}
html[dir=ltr] #drawer{transform:translateX(100%)}
.ov.on #drawer{transform:none}
.dh{display:flex;align-items:center;justify-content:space-between;padding:24px;border-bottom:1px solid var(--line)}
#lines{flex:1;overflow-y:auto;padding:22px 24px;display:flex;flex-direction:column;gap:14px}
.line{display:flex;gap:14px;padding:14px;border:1px solid var(--line);border-radius:18px}
.line .th{width:72px;height:72px;flex-shrink:0;border-radius:12px;overflow:hidden;background:var(--paper2)}
.qty{display:flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:99px;padding:2px}
.qty button{width:30px;height:30px;border-radius:99px;display:flex;align-items:center;justify-content:center;
  color:var(--muted);transition:all .2s}
.qty button:hover{background:var(--violet-tint);color:var(--violet)}
.qty span{min-width:28px;text-align:center;font-family:var(--lat);font-weight:800;font-size:14px}
.sum{padding:22px 24px;border-top:1px solid var(--line);background:var(--paper)}
.sum .row{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:10px}
.sum .row.tot{margin:16px 0 0;padding-top:16px;border-top:1px solid var(--line);align-items:baseline;color:var(--ink)}
.sum .row.tot dt{font-size:16px;font-weight:800}
.sum .row.tot dd{font-family:var(--lat);font-size:24px;font-weight:900;color:var(--violet)}
#modal{position:fixed;inset:0;z-index:90;display:none;overflow-y:auto;padding:24px 16px}
#modal.on{display:block}
#modal .sheet{position:relative;max-width:540px;margin:40px auto;background:#fff;border-radius:28px;padding:30px}
@media(min-width:640px){#modal .sheet{padding:40px}}
.field{margin-bottom:20px}
.field .lb{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.field label{font-size:13.5px;font-weight:700}
.field .opt{font-size:12px;color:var(--muted)}
.field input,.field textarea{width:100%;border:2px solid var(--line);border-radius:14px;padding:14px 16px;
  font-size:15px;color:var(--ink);outline:none;transition:border-color .25s,box-shadow .25s;resize:none;background:#fff}
.field input:focus,.field textarea:focus{border-color:var(--violet);box-shadow:0 0 0 4px var(--violet-tint)}
.field.bad input,.field.bad textarea{border-color:var(--orange)}
.field .err{display:none;margin-top:6px;font-size:12px;color:#c2521c;font-weight:600}
.field.bad .err{display:block}
.field .hint{margin-top:6px;font-size:12px;color:var(--muted)}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;gap:10px}

/* ——— Supplied images share the illustration's frame ——— */
.artimg{position:relative;overflow:hidden;display:block;width:100%;height:100%}
.artimg .bed{position:absolute;inset:0}
.artimg .vig{position:absolute;inset:0;background:linear-gradient(to top,rgba(16,6,24,.35),transparent 55%)}
.artimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.artimg.cut img{object-fit:contain;object-position:center bottom;padding:6% 8% 0}
/* The plan's duration engraved into the corner of the frame, behind the
   player — outlined rather than filled so the photograph stays legible. */
.artimg .ghost{position:absolute;top:-.14em;inset-inline-start:.06em;
  font-family:var(--lat);font-variation-settings:'wdth' 125;font-weight:900;
  font-size:clamp(3.4rem,9vw,5.2rem);line-height:1;letter-spacing:-.05em;
  color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.34);
  pointer-events:none;user-select:none}
@supports not (-webkit-text-stroke:1px #000){.artimg .ghost{color:rgba(255,255,255,.2)}}
.artimg .glow{position:absolute;left:50%;bottom:-14%;width:82%;aspect-ratio:1/.42;transform:translateX(-50%);
  border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.3),transparent 72%);
  filter:blur(6px);pointer-events:none}

/* ——— Poster wall ———
   The league key art, full-bleed, with the mark and the name burned into the
   bottom of each tile. This is the section carrying the visual weight, so the
   first tile is given two columns on wide screens. */
/* Six tiles. Three columns with the first at 2×2 fills the grid exactly:
   the lead tile takes rows 1–2 of columns 1–2, two tiles stack beside it,
   and the last three complete row 3. */
.posterWall{margin-top:52px;display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:700px){.posterWall{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
  .posterWall .po:first-child{grid-column:span 2;grid-row:span 2}}
.po{position:relative;display:block;overflow:hidden;border-radius:20px;background:#1b0b28;
  aspect-ratio:4/5;text-decoration:none;isolation:isolate;
  box-shadow:0 18px 40px -26px rgba(22,8,31,.6);
  transition:transform .5s cubic-bezier(.16,1,.3,1),box-shadow .5s}
.po:hover,.po:focus-visible{transform:translateY(-6px);box-shadow:0 34px 64px -30px rgba(22,8,31,.62)}
.po img.shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  transition:transform 1.2s cubic-bezier(.16,1,.3,1)}
.po:hover img.shot{transform:scale(1.06)}
.po .scrim{position:absolute;inset:0;
  background:linear-gradient(to top,rgba(14,4,22,.9) 4%,rgba(14,4,22,.45) 34%,transparent 62%)}
.po .cap{position:absolute;inset-inline:0;bottom:0;padding:20px 20px 22px;display:flex;
  align-items:center;gap:12px;color:#fff}
.po .cap img{flex-shrink:0;width:34px;height:34px;object-fit:contain;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,.55))}
.po .cap b{display:block;font-family:var(--lat);font-variation-settings:'wdth' 116;
  font-weight:900;font-size:14.5px;letter-spacing:.01em;line-height:1.2}
.po .cap s{display:block;text-decoration:none;margin-top:3px;font-size:12px;
  color:rgba(255,255,255,.72)}
.po .live{position:absolute;top:14px;inset-inline-start:14px;display:inline-flex;align-items:center;
  gap:6px;padding:5px 10px;border-radius:99px;background:rgba(14,4,22,.62);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  font-size:10.5px;font-weight:800;letter-spacing:.08em;color:#fff}
.po .live i{width:6px;height:6px;border-radius:99px;background:#ff4d4d;
  box-shadow:0 0 0 0 rgba(255,77,77,.7);animation:beat 1.9s ease-out infinite}
@keyframes beat{70%{box-shadow:0 0 0 7px rgba(255,77,77,0)}100%{box-shadow:0 0 0 0 rgba(255,77,77,0)}}
@media(prefers-reduced-motion:reduce){.po .live i{animation:none}
  .po,.po img.shot{transition:none}.po:hover{transform:none}.po:hover img.shot{transform:none}}

/* League marks sit beside the league name. The slot keeps its width when a
   competition has no mark, so every name in the grid starts on the same line. */
.lg .top{display:flex;align-items:center;gap:13px}
.lg .crest{flex-shrink:0;width:42px;height:42px;object-fit:contain;object-position:center}
.lg .nm{min-width:0}
/* The full list under the poster wall is a summary, not a second table —
   one wrapping row of chips, so it reads as a footnote to the posters. */
.leagueList{display:flex;flex-wrap:wrap;gap:10px;background:none;padding:22px}
.leagueList .lg{display:flex;flex-direction:row;align-items:center;gap:9px;
  padding:8px 15px 8px 9px;border:1px solid var(--line);border-radius:99px;background:#fff}
html[dir=rtl] .leagueList .lg{padding:8px 9px 8px 15px}
.leagueList .lg .top{gap:9px}
.leagueList .lg .crest{width:24px;height:24px}
.leagueList .lg .nm{font-size:13px}
.leagueList .lg .sub{display:none}

/* The player standing in the hero, over the illustrated pitch.
   Never mirrored for RTL — flipping a photo reverses the kit and sponsor. */
.heroArt .star{position:absolute;z-index:3;inset-inline-end:-4%;bottom:-2%;height:88%;width:auto;
  object-fit:contain;object-position:bottom center;pointer-events:none;
  filter:drop-shadow(0 26px 34px rgba(22,8,31,.34));
  animation:starIn 1.1s .35s cubic-bezier(.16,1,.3,1) both}
@keyframes starIn{from{opacity:0;transform:translateY(26px) scale(.97)}
  to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.heroArt .star{animation:none;opacity:1}}
@media(max-width:900px){.heroArt .star{height:78%;inset-inline-end:-2%}}

/* ——— Preloader ——— */
#pre{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;
  justify-content:center;background:#fff;transition:opacity .65s,transform .65s}
#pre img{width:88px;height:88px;animation:pop .8s cubic-bezier(.16,1,.3,1) both}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
#pre .w{margin-top:22px;font-family:var(--lat);font-variation-settings:'wdth' 122;font-weight:900;
  font-size:22px;letter-spacing:.04em}
#pre .w i{font-style:normal;color:var(--orange)}
#pre .bar{margin-top:26px;width:170px;height:3px;border-radius:99px;background:var(--line);overflow:hidden}
#pre .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--violet),var(--orange))}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#skip{position:absolute;inset-inline-start:16px;top:-100px;z-index:200;background:var(--violet);color:#fff;
  padding:12px 22px;border-radius:99px;font-weight:700;transition:top .2s}
#skip:focus{top:16px}

@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .rev{opacity:1;transform:none}
  #pre{display:none}
}
</style>
</head>

<section id="faq" class="pad" style="scroll-margin-top:104px">

      <button class="ico" data-close-cart aria-label="Close" style="width:42px;height:42px;min-width:42px;padding:0">
        <svg viewBox="0 0 16 16" width="15" height="15" fill="none" aria-hidden><path d="m4 4 8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div id="lines"></div>
    <div class="sum" id="cartSum" style="display:none">
      <dl style="margin:0">
        <div class="row"><dt data-i="cart.subtotal"></dt><dd id="sSub" dir="ltr"></dd></div>
        <div class="row" id="sSaveRow" style="color:#12a150;font-weight:700"><dt data-i="cart.savings"></dt><dd id="sSave" dir="ltr"></dd></div>
        <div class="row tot"><dt data-i="cart.total"></dt><dd id="sTot" dir="ltr"></dd></div>
      </dl>

      </div>
      <div class="field" id="fPhone">
        <div class="lb"><label for="cPhone"><span data-i="checkout.phone"></span> <span style="color:var(--orange)">*</span></label></div>

        <p class="hint" data-i="checkout.phoneHint"></p><p class="err" data-i="checkout.phoneError"></p>
      </div>

        </div>
        <button type="submit" class="btn btn-wa btn-lg btn-full"><span data-i="checkout.submit"></span></button>
        <p style="margin-top:14px;font-size:12.5px;color:var(--muted)" id="coNote"></p>
      </div>
    </form>
  </div>
</div>

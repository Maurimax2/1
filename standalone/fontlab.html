<!-- ============================================================
     FONT LAB — preview builds only.
     A floating switcher that swaps --head / --ui / --disp so the real
     homepage can be read in each candidate pairing. build-maurimax.mjs
     injects this into maurimax.preview.html and strips it from the
     shipped maurimax.html, so none of it reaches production.
     ============================================================ -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@200..900&family=Almarai:wght@300;400;700;800&family=Anton&family=Archivo+Narrow:wght@400..700&family=Archivo:wght@400..900&family=Big+Shoulders+Display:wght@500..900&family=Cairo:wght@200..900&family=Changa:wght@200..800&family=IBM+Plex+Sans+Arabic:wght@200;300;400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Readex+Pro:wght@200..700&family=Reem+Kufi:wght@400..700&family=Tajawal:wght@300;400;500;700;800&display=swap">
<style>
#fontlab{position:fixed;z-index:120;right:12px;top:66px;
  font-family:'Archivo',system-ui,sans-serif;direction:ltr;text-align:left;
  display:flex;flex-direction:column;align-items:flex-end}
#fontlab .fl-toggle{display:flex;align-items:center;gap:8px;height:44px;padding:0 15px;
  border-radius:3px;background:#e86a30;color:#fff;font-size:12px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;border:none;cursor:pointer;
  box-shadow:0 14px 30px -14px rgba(0,0,0,.8)}
#fontlab .fl-toggle b{font-weight:900}
#fontlab .fl-panel{display:none;width:250px;margin-top:9px;padding:6px;
  background:#0b060f;border:1px solid rgba(255,255,255,.16);border-radius:3px;
  box-shadow:0 24px 50px -20px rgba(0,0,0,.9)}
#fontlab.open .fl-panel{display:block}
#fontlab .fl-cap{padding:8px 10px 9px;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:rgba(255,255,255,.4);border-bottom:1px solid rgba(255,255,255,.12)}
#fontlab .fl-opt{display:flex;align-items:baseline;gap:10px;width:100%;padding:10px;
  background:none;border:none;color:#fff;text-align:left;cursor:pointer;border-radius:2px}
#fontlab .fl-opt:hover{background:rgba(255,255,255,.07)}
#fontlab .fl-opt[aria-pressed=true]{background:#e86a30}
#fontlab .fl-opt i{font-style:normal;font-weight:900;font-size:13px;color:#e86a30;min-width:20px}
#fontlab .fl-opt[aria-pressed=true] i{color:#fff}
#fontlab .fl-opt span{font-size:12.5px;font-weight:600;line-height:1.35}
#fontlab .fl-opt s{display:block;text-decoration:none;font-size:10.5px;font-weight:400;
  color:rgba(255,255,255,.5)}
#fontlab .fl-opt[aria-pressed=true] s{color:rgba(255,255,255,.8)}
@media(max-width:520px){#fontlab{right:10px;top:62px}
  #fontlab .fl-toggle{height:38px;padding:0 12px;font-size:11px}
  #fontlab .fl-panel{width:min(250px,calc(100vw - 24px))}}
</style>
<div id="fontlab">
  <button class="fl-toggle" id="flToggle" type="button">Font <b id="flNow">01</b></button>
  <div class="fl-panel" id="flPanel"></div>
</div>
<script>
(function () {
  var SYS = ',system-ui,-apple-system,"Segoe UI",sans-serif';
  var OPTS = [
    ['Alexandria',           'Alexandria',           'Big Shoulders Display', 'Alexandria + Big Shoulders', 'current'],
    ['IBM Plex Sans Arabic', 'IBM Plex Sans Arabic', 'IBM Plex Sans',         'IBM Plex Sans Arabic',       'precise, technical'],
    ['Reem Kufi',            'Tajawal',              'Archivo',               'Reem Kufi + Tajawal',        'geometric Kufic'],
    ['Changa',               'Cairo',                'Anton',                 'Changa + Anton',             'sports poster'],
    ['Readex Pro',           'Readex Pro',           'Readex Pro',            'Readex Pro',                 'open, legible'],
    ['Almarai',              'Almarai',              'Archivo Narrow',        'Almarai + Archivo Narrow',   'editorial, calm']
  ];
  var box = document.getElementById('fontlab');
  var panel = document.getElementById('flPanel');
  var now = document.getElementById('flNow');

  panel.innerHTML = '<p class="fl-cap">Typeface test — not shipped</p>' +
    OPTS.map(function (o, i) {
      return '<button class="fl-opt" type="button" data-i="' + i + '" aria-pressed="' + (i === 0) + '">' +
        '<i>0' + (i + 1) + '</i><span>' + o[3] + '<s>' + o[4] + '</s></span></button>';
    }).join('');

  function apply(i) {
    var o = OPTS[i], r = document.documentElement.style;
    r.setProperty('--head', '"' + o[0] + '"' + SYS);
    r.setProperty('--ui',   '"' + o[1] + '"' + SYS);
    r.setProperty('--disp', '"' + o[2] + '",' + '"Archivo Narrow",sans-serif');
    now.textContent = '0' + (i + 1);
    panel.querySelectorAll('.fl-opt').forEach(function (b, j) {
      b.setAttribute('aria-pressed', j === i);
    });
    try { localStorage.setItem('maurimax.fontlab', i); } catch (e) {}
    // Category wordmarks are measured, so they have to be refitted.
    if (window.MXFit) window.MXFit();
  }

  panel.addEventListener('click', function (e) {
    var b = e.target.closest('.fl-opt');
    if (!b) return;
    apply(+b.dataset.i);
    // Close straight away — the panel sits over the hero, which is the thing
    // being judged.
    box.classList.remove('open');
  });
  document.getElementById('flToggle').addEventListener('click', function () {
    box.classList.toggle('open');
  });
  document.addEventListener('click', function (e) {
    if (!e.target.closest('#fontlab')) box.classList.remove('open');
  });

  var start = 0;
  try { var v = localStorage.getItem('maurimax.fontlab'); if (v !== null && OPTS[+v]) start = +v; } catch (e) {}
  apply(start);
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { if (window.MXFit) window.MXFit(); });
  }
})();
</script>

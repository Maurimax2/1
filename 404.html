<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الصفحة غير موجودة | MAURIMAX</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@200..900&family=Big+Shoulders+Display:wght@500..900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#0b060f;--orange:#e86a30;--line:rgba(255,255,255,.14);
  --ui:'Alexandria',system-ui,-apple-system,'Segoe UI',sans-serif;
  --disp:'Big Shoulders Display','Arial Narrow',sans-serif;
  color-scheme:dark;
}
body{min-height:100svh;display:grid;place-items:center;padding:32px 20px;
  background:
    radial-gradient(ellipse 60% 50% at 72% 8%,rgba(122,43,196,.55),transparent 68%),
    radial-gradient(ellipse 55% 45% at 16% 90%,rgba(138,30,99,.45),transparent 66%),
    var(--ink);
  color:#fff;font-family:var(--ui);line-height:1.6;-webkit-font-smoothing:antialiased}
.box{width:100%;max-width:460px;text-align:center}
.brand{display:inline-flex;align-items:center;gap:10px;margin-bottom:34px}
.brand img{width:34px;height:34px;display:block}
.brand b{font-family:var(--disp);font-weight:800;font-size:23px;letter-spacing:.03em}
.brand b i{font-style:normal;color:var(--orange)}
.code{font-family:var(--disp);font-weight:900;font-size:clamp(4.5rem,22vw,7rem);line-height:.85;
  color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.34)}
h1{margin-top:20px;font-size:clamp(1.2rem,5vw,1.6rem);font-weight:700;line-height:1.4}
p{margin-top:10px;font-size:14px;color:rgba(255,255,255,.62)}
p.fr{margin-top:4px;font-size:13px;color:rgba(255,255,255,.42)}
.acts{margin-top:30px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
a.btn{display:inline-flex;align-items:center;height:48px;padding:0 24px;border-radius:99px;
  background:#fff;color:var(--ink);font-size:14px;font-weight:600;text-decoration:none;
  transition:background .2s,color .2s}
a.btn:hover{background:var(--orange);color:#fff}
a.ghost{border-radius:3px;background:none;color:#fff;border:1px solid var(--line)}
a.ghost:hover{background:#fff;color:var(--ink)}
:focus-visible{outline:2px solid var(--orange);outline-offset:3px}
</style>
</head>
<body>
  <div class="box">
    <span class="brand"><img src="/assets/logo.png" alt=""><b>MAURI<i>MAX</i></b></span>
    <div class="code" aria-hidden="true">404</div>
    <h1>هذه الصفحة غير موجودة.</h1>
    <p>ربما تغيّر الرابط أو حُذفت الصفحة.</p>
    <p class="fr" dir="ltr">Cette page n’existe pas. Le lien a peut-être changé.</p>
    <div class="acts">
      <a class="btn" href="/">العودة إلى الصفحة الرئيسية</a>
      <a class="btn ghost" href="https://wa.me/22246261721" target="_blank" rel="noopener">واتساب</a>
    </div>
  </div>
</body>
</html>
